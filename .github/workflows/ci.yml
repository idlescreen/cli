name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Checkout runtime (path deps)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: idlescreen/runtime
          path: runtime
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup show || true
          if [ -f rust-toolchain.toml ]; then rustup show; else rustup default stable; fi
      - name: file length cap (16-256 lines per page)
        # Org-wide rule from .github/RULES.md. The cli repo's own
        # tree + the cross-cut excludes runtime/ (which has its
        # own gate in idlescreen/runtime).
        run: |
          over=$(find . -name '*.rs' -not -path './target/*' -not -path './runtime/*' \
              | xargs wc -l \
              | awk '$2 != "total" && ($1 > 256 || $1 < 16)')
          if [ -n "$over" ]; then
            echo "Files outside 16-256 line range:"
            echo "$over"
            exit 1
          fi
      - name: every page declares a performance metric
        # Every `.rs` page must carry a `// perf:` line saying what it
        # costs and how a machine would notice if that changed (`bench`,
        # `test`, or `review`). Pure bash/grep/awk, so it rides along with
        # the checkout rather than costing another job.
        run: bash scripts/check-perf-labels.sh
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace --all-targets
      - name: cargo build (release)
        run: cargo build --release --workspace

  bootstrap:
    # Guards the `runtime/` symlink in bootstrap.sh. The `test` job checks
    # the engine out into `runtime/` itself, so it cannot catch a bootstrap
    # that never creates the link — which is exactly how local builds of
    # this CLI repo fail on a fresh clone. This job checks out cli ONLY
    # and runs the real script.
    name: bootstrap on a clean checkout
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup show || true
      - name: No pre-existing engine checkout
        run: |
          if [ -e runtime ]; then
            echo "::error::runtime/ already exists — this job must start from a bare checkout"
            exit 1
          fi
      - name: Run bootstrap.sh
        run: ./bootstrap.sh
      - name: The link exists where Cargo.toml expects it
        run: |
          test -e runtime/crates/idle-dbus/Cargo.toml \
            || { echo "::error::bootstrap.sh did not produce runtime/crates/idle-dbus"; exit 1; }
          cargo metadata --format-version 1 >/dev/null
          echo "bootstrap produced a resolvable runtime/ path dep"

  deny:
    # This repo had no deny.toml at all, and `runtime`'s CI ran
    # `cargo deny check advisories licenses` — skipping the `sources` section
    # where unknown-registry/unknown-git are denied, i.e. the typosquat
    # control. This runs the bare form: advisories, licenses, bans, sources.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Checkout runtime (path deps)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: idlescreen/runtime
          path: runtime
      - name: Install cargo-deny
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y cargo-deny
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: cargo deny check
        run: cargo deny check
