name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Checkout runtime (path deps)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: idlescreen/runtime
          path: runtime
      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          rustup show || true
          if [ -f rust-toolchain.toml ]; then rustup show; else rustup default stable; fi
      - name: file length cap (256 lines)
        run: |
          over=$(find . -name '*.rs' -not -path './target/*' -not -path './runtime/*' | xargs wc -l | awk '$1 > 256 && $2 != "total" {print}')
          [ -z "$over" ] || { echo "Files over 256 lines:"; echo "$over"; exit 1; }
      - name: cargo fmt
        run: cargo fmt --all -- --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: cargo test
        run: cargo test --workspace --all-targets
      - name: cargo build (release)
        run: cargo build --release --workspace

  deny:
    # This repo had no deny.toml at all, and `runtime`'s CI ran
    # `cargo deny check advisories licenses` — skipping the `sources` section
    # where unknown-registry/unknown-git are denied, i.e. the typosquat
    # control. This runs the bare form: advisories, licenses, bans, sources.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Checkout runtime (path deps)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: idlescreen/runtime
          path: runtime
      - name: Install cargo-deny
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall -y cargo-deny
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: cargo deny check
        run: cargo deny check
