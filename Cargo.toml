[package]
authors = ["idlescreen developers"]
repository = "https://github.com/idlescreen/cli"
name = "idle-cli"
version = "4.0.1"
edition = "2024"
description = "Command-line interface for the IdleScreen daemon"
license = "Apache-2.0"

# Binary is `idle-cli`; the `idlescreen` package owns /usr/bin/idlescreen
# and forwards daemon verbs here. Never ship /usr/bin/idle (collides with
# Fedora python3-idle).
[[bin]]
name = "idle-cli"
path = "src/main.rs"

[features]
default = []
journald = ["dep:tracing-journald"]

[dependencies]
idle-dbus = { version = "0.7.0", path = "runtime/crates/idle-dbus" }
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"
libc = "0.2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
tracing-journald = { version = "0.3", optional = true }

# build.rs generates completions from the same cli.rs the binary uses.
[build-dependencies]
clap = { version = "4.5", features = ["derive"] }
clap_complete = "4.5"

[lints.rust]
unused_must_use = "warn"
dead_code = "warn"
unsafe_op_in_unsafe_fn = "warn"
deprecated = "allow"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
similar_names = "allow"
cast_precision_loss = "allow"
cast_possible_truncation = "allow"
cast_sign_loss = "allow"
cast_lossless = "allow"
cast_abs_to_unsigned = "allow"
many_single_char_names = "allow"
ignored_unit_patterns = "allow"
struct_excessive_bools = "allow"
manual_let_else = "allow"
unnecessary_wraps = "allow"
cast_possible_wrap = "allow"
ptr_as_ptr = "allow"
doc_markdown = "allow"
needless_pass_by_value = "allow"
single_match_else = "allow"
items_after_statements = "allow"
borrow_as_ptr = "allow"
unchecked_time_subtraction = "allow"
unnecessary_cast = "allow"
map_unwrap_or = "allow"
type_complexity = "allow"
redundant_closure_for_method_calls = "allow"
io_other_error = "allow"
case_sensitive_file_extension_comparisons = "allow"
if_not_else = "allow"
uninlined_format_args = "allow"
too_many_arguments = "allow"
redundant_else = "allow"
format_push_string = "allow"
too_many_lines = "allow"
unused_async = "allow"
implicit_clone = "allow"
used_underscore_binding = "allow"
manual_range_contains = "allow"
unreadable_literal = "allow"
semicolon_if_nothing_returned = "allow"
unwrap_used = "allow"
expect_used = "allow"
panic = "warn"
todo = "warn"
unimplemented = "warn"
unreachable = "warn"

[package.metadata.deb]
name = "idle-cli"
changelog = "debian/changelog"
copyright = "2026 IdleScreen"
maintainer = "IdleScreen <jerydleuck@gmail.com>"
extended-description = "CLI for controlling the Idle daemon over D-Bus (binary: idle-cli; `idlescreen <verb>` routes here via the idlescreen router)."
# idlescreen (router) preserves `idlescreen <verb>` invocations and owns
# /usr/bin/idlescreen — Recommends, not Depends: idlescreen already
# Depends on idle-cli, and a hard cycle buys nothing over recommends.
depends = "libc6, idle-daemon (>= 3.5.0)"
recommends = "idlescreen"
section = "utils"
priority = "optional"
assets = [
    ["target/release/idle-cli", "usr/bin/idle-cli", "755"],
    # No .desktop here — app launcher entry lives in idle-tui (avoids two "IdleScreen" icons).
    ["assets/idlescreen-beams.png", "usr/share/icons/hicolor/48x48/apps/idlescreen-beams.png", "644"],
    ["idle.1", "usr/share/man/man1/idlescreen.1", "644"],
    ["target/release/completions/idlescreen", "usr/share/bash-completion/completions/idlescreen", "644"],
    ["target/release/completions/_idlescreen", "usr/share/zsh/site-functions/_idlescreen", "644"],
    ["target/release/completions/idlescreen.fish", "usr/share/fish/vendor_completions.d/idlescreen.fish", "644"],
]

[package.metadata.generate-rpm]
name = "idle-cli"
release = "1"
arch = "x86_64"
summary = "IdleScreen CLI (idle-cli)"
description = "CLI for controlling the Idle daemon over D-Bus (binary: idle-cli; `idlescreen <verb>` routes here via the idlescreen router). Does not install /usr/bin/idle (reserved for python3-idle on Fedora)."
license = "Apache-2.0"
assets = [
    { source = "target/release/idle-cli", dest = "/usr/bin/idle-cli", mode = "755", user = "root", group = "root" },
    { source = "assets/idlescreen-beams.png", dest = "/usr/share/icons/hicolor/48x48/apps/idlescreen-beams.png", mode = "644", user = "root", group = "root" },
    { source = "idle.1", dest = "/usr/share/man/man1/idlescreen.1", mode = "644", user = "root", group = "root" },
    { source = "target/release/completions/idlescreen", dest = "/usr/share/bash-completion/completions/idlescreen", mode = "644", user = "root", group = "root" },
    { source = "target/release/completions/_idlescreen", dest = "/usr/share/zsh/site-functions/_idlescreen", mode = "644", user = "root", group = "root" },
    { source = "target/release/completions/idlescreen.fish", dest = "/usr/share/fish/vendor_completions.d/idlescreen.fish", mode = "644", user = "root", group = "root" },
]

[package.metadata.generate-rpm.requires]
idle-daemon = ">= 3.5.0"

[package.metadata.generate-rpm.recommends]
idlescreen = "*"
